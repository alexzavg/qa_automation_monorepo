name: WDIO Web Tests
run-name: 🧪 WDIO Web Tests

on:
  schedule:
    - cron: '0 9 * * 1-5' # for Stage env - 11:00 AM Kyiv time (Kyiv is UTC+3, so 12:00 UTC)
    - cron: '0 9 30 * 1-5' # for Prod env - 11:30 AM Kyiv time (Kyiv is UTC+3, so 12:30 UTC)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      appName:
        description: 'Name of the app to test (e.g. testApp)'
        required: true
        default: 'testApp'
        type: string
      suiteName:
        description: 'Test suite name (e.g. all, e2e)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - e2e
      max_instances:
        description: 'Number of parallel instances to run tests (e.g. 1, 2, 3)'
        required: true
        default: '1'
        type: string

env:
  SLACK_CHANNEL: ${{vars.WDIO_SLACK_CHANNEL}}
  SLACK_WEBHOOK: ${{vars.WDIO_SLACK_WEBHOOK}}
  SLACK_USER:    ${{vars.SLACK_USER}}
  CI_PIPELINE_URL: "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ: ${{vars.TZ}}
  NODE_VERSION: 20.x

jobs:
  set-run-params:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.set-params.outputs.environment }}
      app_name: ${{ steps.set-params.outputs.app_name }}
      suite_name: ${{ steps.set-params.outputs.suite_name }}
      max_instances: ${{ steps.set-params.outputs.max_instances }}
    steps:
      - id: set-params
        run: |
          # For scheduled runs
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 9 * * 1-5" ]]; then
              echo "environment=stage" >> $GITHUB_OUTPUT
              echo "app_name=testApp" >> $GITHUB_OUTPUT
              echo "suite_name=all" >> $GITHUB_OUTPUT
              echo "max_instances=1" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.schedule }}" == "0 9 30 * 1-5" ]]; then
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "app_name=testApp" >> $GITHUB_OUTPUT
              echo "suite_name=all" >> $GITHUB_OUTPUT
              echo "max_instances=1" >> $GITHUB_OUTPUT
            fi
          # For workflow_dispatch runs
          else
            echo "environment=${{ github.event.inputs.environment || 'stage' }}" >> $GITHUB_OUTPUT
            echo "app_name=${{ github.event.inputs.appName || 'testApp' }}" >> $GITHUB_OUTPUT
            echo "suite_name=${{ github.event.inputs.suiteName || 'all' }}" >> $GITHUB_OUTPUT
            echo "max_instances=${{ github.event.inputs.max_instances || '1' }}" >> $GITHUB_OUTPUT
          fi
          
          echo "Using parameters:"
          echo "- Environment: $(cat $GITHUB_OUTPUT | grep 'environment=' | cut -d= -f2)"
          echo "- App Name: $(cat $GITHUB_OUTPUT | grep 'app_name=' | cut -d= -f2)"
          echo "- Suite Name: $(cat $GITHUB_OUTPUT | grep 'suite_name=' | cut -d= -f2)"
          echo "- Max Instances: $(cat $GITHUB_OUTPUT | grep 'max_instances=' | cut -d= -f2)"

  web_tests:
    needs: set-run-params
    runs-on: ubuntu-22.04
    env:
      REPORT_URL: https://alexzavg.github.io/qa_automation_monorepo/${{ needs.set-run-params.outputs.app_name }}_${{ needs.set-run-params.outputs.suite_name }}_${{ needs.set-run-params.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
          chrome-args: >
            --no-sandbox
            --disable-dev-shm-usage
            --headless
            --disable-gpu
            --window-size=1920,1080

      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd wdio
          npm install

      - name: Create .env file
        run: |
          cd wdio
          ENV="${{ needs.set-run-params.outputs.environment }}"
          echo "Creating .env file for $ENV environment"
          
          if [ "$ENV" = "stage" ]; then
            echo "${{ secrets.WDIO_CONFIG_STAGE }}" > .env.stage
            echo "Created .env.stage"
          elif [ "$ENV" = "prod" ]; then
            echo "${{ secrets.WDIO_CONFIG_PROD }}" > .env.prod
            echo "Created .env.prod"
          else
            echo "Unknown environment: $ENV"
            exit 1
          fi

      - name: Run Web tests
        run: |
          cd wdio
          export DISPLAY=:99
          echo "=== Running Tests ==="
          echo "Environment: ${{ needs.set-run-params.outputs.environment }}"
          echo "App Name: ${{ needs.set-run-params.outputs.app_name }}"
          echo "Suite: ${{ needs.set-run-params.outputs.suite_name }}"
          echo "Max Instances: ${{ needs.set-run-params.outputs.max_instances }}"
          echo "====================="
          
          ENV=${{ needs.set-run-params.outputs.environment }} npx wdio run wdio.web.conf.ts \
            --appName=${{ needs.set-run-params.outputs.app_name }} \
            --suiteName=${{ needs.set-run-params.outputs.suite_name }} \
            --maxInstances=${{ needs.set-run-params.outputs.max_instances }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ needs.set-run-params.outputs.app_name }}_${{ needs.set-run-params.outputs.suite_name }}_${{ needs.set-run-params.outputs.environment }}"
          # Get the latest build number for this slug
          echo "Checking for existing builds in ${SLUG}"
          
          # First, get the directory contents from gh-pages branch
          echo "Checking contents of: ${SLUG}"
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          echo "URL: $curl_url"
          DIR_CONTENTS=$(curl -s "$curl_url" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          
          # Add debug output
          echo "Raw API response: $DIR_CONTENTS"
          
          if [ -z "$DIR_CONTENTS" ]; then
            echo "No builds found yet, starting with 1"
            BUILD_NUMBER="1"
          else
            # Check if the response is an array (directory exists)
            if echo "$DIR_CONTENTS" | grep -q '"name"'; then
              echo "Directory exists, checking for builds..."
              # Get the latest build number
              LATEST_BUILD=$(echo "$DIR_CONTENTS" \
                | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' \
                | sort -nr \
                | head -n 1)
              
              if [ -z "$LATEST_BUILD" ]; then
                echo "No builds found yet, starting with 1"
                BUILD_NUMBER="1"
              else
                echo "Latest build found: $LATEST_BUILD"
                BUILD_NUMBER=$(($LATEST_BUILD + 1))
                echo "New build number: $BUILD_NUMBER"
              fi
            else
              # If it's not an array, it means the directory exists but is empty
              echo "Directory exists but is empty, starting with 1"
              BUILD_NUMBER="1"
            fi
          fi
          
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wdio/html-report/allure-report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"

          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ needs.set-run-params.outputs.suite_name }}* for app *${{ needs.set-run-params.outputs.app_name }}* on environment *${{ needs.set-run-params.outputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK
