name: Playwright Web Tests
run-name: 🧪 Playwright Web Tests

on:
  #schedule:
  #  - cron: '0 7 * * 1-5' # 9:00 AM Kyiv time (Kyiv is UTC+3, so 7:00 UTC)
  # push:
  #   branches:
  #     - template
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite(s) to run (comma-separated, e.g. CHAT_TESTS, SOFTSERVE_TESTS, BOOKRETREATS_TESTS, or PW_ALL). Available suites: CHAT_TESTS, SOFTSERVE_TESTS, BOOKRETREATS_TESTS, BLOCKCHAIN_TESTS, GMAIL_TESTS, AUTHENTICATION_TESTS'
        required: true
        default: 'ALL'
        type: string
      browser:
        description: 'Browser to run the tests against'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  ALL_TESTS:              ${{vars.PW_ALL_TESTS}}
  CHAT_TESTS:             ${{vars.PW_CHAT_TESTS}}
  SOFTSERVE_TESTS:        ${{vars.PW_SOFTSERVE_TESTS}}
  BOOKRETREATS_TESTS:     ${{vars.PW_BOOKRETREATS_TESTS}}
  BLOCKCHAIN_TESTS:       ${{vars.PW_BLOCKCHAIN_TESTS}}
  GMAIL_TESTS:            ${{vars.PW_GMAIL_TESTS}}
  AUTHENTICATION_TESTS:   ${{vars.PW_AUTHENTICATION_TESTS}}
  SLACK_CHANNEL:          ${{vars.PW_SLACK_CHANNEL}}
  SLACK_WEBHOOK:          ${{vars.PW_SLACK_WEBHOOK}}
  SLACK_USER:             ${{vars.SLACK_USER}}
  CI_PIPELINE_URL:        "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ:                     ${{vars.TZ}}
  NODE_VERSION:           22.x

jobs:
  set-matrix:
    runs-on: ubuntu-22.04
    outputs:
      suite-matrix: ${{ steps.set-matrix.outputs.suite-matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL_SUITES=(
            "CHAT_TESTS"
            "SOFTSERVE_TESTS"
            "BOOKRETREATS_TESTS"
            "BLOCKCHAIN_TESTS"
            "GMAIL_TESTS"
            "AUTHENTICATION_TESTS"
          )
          if [[ "${{ github.event.inputs.test_suite }}" == "ALL" ]]; then
            SUITES_JSON=$(printf '%s\n' "${ALL_SUITES[@]}" | jq -R . | jq -c -s .)
            echo "suite-matrix=$SUITES_JSON" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra SELECTED <<< "${{ github.event.inputs.test_suite }}"
            SUITES_JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -c -s .)
            echo "suite-matrix=$SUITES_JSON" >> $GITHUB_OUTPUT
          fi

  cache-deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          npm install
          npm install -g ts-node
          npx playwright install chrome
      - name: Cache node_modules and Playwright browsers
        id: cache-all
        uses: actions/cache@v4
        with:
          path: |
            playwright/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-browsers-${{ hashFiles('playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-browsers-

  run_tests:
    needs: [set-matrix, cache-deps]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        suite: ${{ fromJson(needs.set-matrix.outputs.suite-matrix) }}
      fail-fast: false
    env:
      REPORT_URL: https://alexzavg.github.io/qa_automation_monorepo/${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules and Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: |
            playwright/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-browsers-${{ hashFiles('playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-browsers-

      - name: Install dependencies
        run: |
          cd playwright
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules)" ]; then
            npm install
          fi
          npm install -g ts-node
          npx playwright install chrome

      - name: Create .env file
        run: |
          cd playwright
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "${{ secrets.PW_CONFIG_PROD }}" > .env.prod
          elif [[ "${{ github.event.inputs.environment }}" == "stage" ]]; then
            echo "${{ secrets.PW_CONFIG_STAGE }}" > .env.stage
          else
            echo "${{ secrets[format('PW_CONFIG_{0}', github.event.inputs.environment)] }}" > ".env.${{ github.event.inputs.environment }}"
          fi

      - name: Run tests
        run: |
          cd playwright
          export PATH=$PWD/node_modules/.bin:$PATH
          suite_value=$(eval echo \${${{ matrix.suite }}})
          xvfb-run node run-playwright.js ${{ github.event.inputs.browser }} "$suite_value" ${{ github.event.inputs.environment }}

      - name: 🧼 Clean previous report folder
        if: always()
        run: |
          cd playwright
          rm -rf ${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}
          mkdir -p ${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}
          cp -r html_report/* ${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}/ || echo "No report found to copy"

      - name: 🛰 Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright/${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}
          destination_dir: ${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${{ matrix.suite }}_${{ github.event.inputs.browser }}_${{ github.event.inputs.environment }}"
          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ matrix.suite }}* with browser *${{ github.event.inputs.browser }}* and environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK