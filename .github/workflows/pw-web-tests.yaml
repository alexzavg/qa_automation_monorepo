name: Playwright Web Tests
run-name: 🧪 Playwright Web Tests

on:
  schedule:
    - cron: '0 7 30 * 1-5' # for Stage env - 9:30 AM Kyiv time (Kyiv is UTC+3, so 10:30 UTC)
    - cron: '0 8 30 * 1-5' # for Prod env - 10:30 AM Kyiv time (Kyiv is UTC+3, so 11:30 UTC)
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite(s) to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - CHAT_TESTS
          - SOFTSERVE_TESTS
          - BOOKRETREATS_TESTS
          - BLOCKCHAIN_TESTS
          - GMAIL_TESTS
          - AUTHENTICATION_TESTS
          - APIS_TESTS
          - ALL
      browser:
        description: 'Browser to run the tests against'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  ALL_TESTS:              ${{vars.PW_ALL_TESTS}}
  CHAT_TESTS:             ${{vars.PW_CHAT_TESTS}}
  SOFTSERVE_TESTS:        ${{vars.PW_SOFTSERVE_TESTS}}
  BOOKRETREATS_TESTS:     ${{vars.PW_BOOKRETREATS_TESTS}}
  BLOCKCHAIN_TESTS:       ${{vars.PW_BLOCKCHAIN_TESTS}}
  GMAIL_TESTS:            ${{vars.PW_GMAIL_TESTS}}
  APIS_TESTS:             ${{vars.PW_APIS_TESTS}}
  AUTHENTICATION_TESTS:   ${{vars.PW_AUTHENTICATION_TESTS}}
  SLACK_CHANNEL:          ${{vars.PW_SLACK_CHANNEL}}
  SLACK_WEBHOOK:          ${{vars.PW_SLACK_WEBHOOK}}
  SLACK_USER:             ${{vars.SLACK_USER}}
  CI_PIPELINE_URL:        "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ:                     ${{vars.TZ}}
  NODE_VERSION:           22.x

jobs:
  set-run-params:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.set-params.outputs.environment }}
      browser: ${{ steps.set-params.outputs.browser }}
      test_suite: ${{ steps.set-params.outputs.test_suite }}
    steps:
      - id: set-params
        run: |
          # For scheduled runs
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 7 30 * 1-5" ]]; then
              echo "environment=stage" >> $GITHUB_OUTPUT
              echo "browser=chrome" >> $GITHUB_OUTPUT
              echo "test_suite=ALL" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.schedule }}" == "0 8 30 * 1-5" ]]; then
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "browser=chrome" >> $GITHUB_OUTPUT
              echo "test_suite=ALL" >> $GITHUB_OUTPUT
            fi
          # For workflow_dispatch runs
          else
            echo "environment=${{ github.event.inputs.environment || 'stage' }}" >> $GITHUB_OUTPUT
            echo "browser=${{ github.event.inputs.browser || 'chrome' }}" >> $GITHUB_OUTPUT
            echo "test_suite=${{ github.event.inputs.test_suite || 'ALL' }}" >> $GITHUB_OUTPUT
          fi
          
          echo "Using parameters:"
          echo "- Environment: $(cat $GITHUB_OUTPUT | grep 'environment=' | cut -d= -f2)"
          echo "- Browser: $(cat $GITHUB_OUTPUT | grep 'browser=' | cut -d= -f2)"
          echo "- Test Suite: $(cat $GITHUB_OUTPUT | grep 'test_suite=' | cut -d= -f2)"

  set-matrix:
    needs: set-run-params
    runs-on: ubuntu-22.04
    outputs:
      suite-matrix: ${{ steps.set-matrix.outputs.suite-matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL_SUITES=(
            "CHAT_TESTS"
            "SOFTSERVE_TESTS"
            "BOOKRETREATS_TESTS"
            "BLOCKCHAIN_TESTS"
            "GMAIL_TESTS"
            "AUTHENTICATION_TESTS"
            "APIS_TESTS"
          )
          
          if [[ "${{ needs.set-run-params.outputs.test_suite }}" == "ALL" ]]; then
            # If ALL, use all suites
            SUITES_JSON=$(printf '%s\n' "${ALL_SUITES[@]}" | jq -R . | jq -c -s .)
          else
            # Use the specified test suite(s)
            IFS=',' read -ra SELECTED <<< "${{ needs.set-run-params.outputs.test_suite }}"
            SUITES_JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -c -s .)
          fi
          
          echo "suite-matrix=$SUITES_JSON" >> $GITHUB_OUTPUT
          echo "Using test suites: $(echo $SUITES_JSON | jq -r 'join(", ")')"

  cache-deps:
    needs: set-run-params
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          npm install
          npm install -g ts-node
          npx playwright install chrome
      - name: Cache node_modules and Playwright browsers
        id: cache-all
        uses: actions/cache@v4
        with:
          path: |
            playwright/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-browsers-${{ hashFiles('playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-browsers-

  run_tests:
    needs: [set-run-params, set-matrix, cache-deps]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        suite: ${{ fromJson(needs.set-matrix.outputs.suite-matrix) }}
      fail-fast: false
    env:
      REPORT_URL: https://alexzavg.github.io/qa_automation_monorepo/${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules and Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: |
            playwright/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-browsers-${{ hashFiles('playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-browsers-

      - name: Install dependencies
        run: |
          cd playwright
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules)" ]; then
            npm install
          fi
          npm install -g ts-node
          npx playwright install chrome

      - name: Create .env file
        run: |
          cd playwright
          ENVIRONMENT="${{ needs.set-run-params.outputs.environment }}"
          echo "Using environment: $ENVIRONMENT"
          
          if [[ "$ENVIRONMENT" == "prod" ]]; then
            echo "${{ secrets.PW_CONFIG_PROD }}" > .env.prod
          elif [[ "$ENVIRONMENT" == "stage" ]]; then
            echo "${{ secrets.PW_CONFIG_STAGE }}" > .env.stage
          else
            echo "${{ secrets[format('PW_CONFIG_{0}', needs.set-run-params.outputs.environment)] }}" > ".env.$ENVIRONMENT"
          fi

      - name: Run tests
        run: |
          cd playwright
          export PATH=$PWD/node_modules/.bin:$PATH
          suite_value=$(eval echo \${${{ matrix.suite }}})
          
          echo "=== Test Configuration ==="
          echo "Environment: ${{ needs.set-run-params.outputs.environment }}"
          echo "Browser: ${{ needs.set-run-params.outputs.browser }}"
          echo "Suite: $suite_value"
          echo "=========================="
          
          xvfb-run node run-playwright.js \
            ${{ needs.set-run-params.outputs.browser }} \
            "$suite_value" \
            ${{ needs.set-run-params.outputs.environment }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ matrix.suite }}_${{ needs.set-run-params.outputs.browser }}_${{ needs.set-run-params.outputs.environment }}"
          echo "Checking for existing builds in ${SLUG}"
          
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          echo "URL: $curl_url"
          DIR_CONTENTS=$(curl -s "$curl_url" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          
          echo "Raw API response: $DIR_CONTENTS"
          
          if echo "$DIR_CONTENTS" | grep -q '"name"'; then
            echo "Directory exists, checking for builds..."
            LATEST_BUILD=$(echo "$DIR_CONTENTS" \
              | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' \
              | sort -nr \
              | head -n 1)
            
            if [ -z "$LATEST_BUILD" ]; then
              echo "No builds found yet, starting with 1"
              BUILD_NUMBER="1"
            else
              echo "Latest build found: $LATEST_BUILD"
              BUILD_NUMBER=$(($LATEST_BUILD + 1))
              echo "New build number: $BUILD_NUMBER"
            fi
          else
            echo "Directory exists but is empty, starting with 1"
            BUILD_NUMBER="1"
          fi
          
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: 🛁 Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright/html_report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"
          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ matrix.suite }}* with browser *${{ github.event.inputs.browser }}* and environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK