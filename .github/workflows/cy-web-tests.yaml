name: Cypress Web Tests
run-name: 🧪 Cypress Web Tests

on:
  schedule:
    - cron: '0 7 * * 1-5' # for Stage env - 9:00 AM Kyiv time (Kyiv is UTC+3, so 10:00 UTC)
    - cron: '0 8 * * 1-5' # for Prod env - 10:00 AM Kyiv time (Kyiv is UTC+3, so 11:00 UTC)
  repository_dispatch:
    types: 
      - run_tests
  workflow_dispatch:
    inputs:
      appName:
        description: 'Name of the app to test (e.g. testApp)'
        required: true
        default: 'testApp'
        type: choice
        options:
          - testApp
      test_suite:
        description: 'Test suite(s) to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - E2E_TESTS
          - API_TESTS
          - ALL
      browser:
        description: 'Browser to run the tests against'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

env:
  ALL_TESTS:       ${{vars.CY_ALL_TESTS}}
  E2E_TESTS:       ${{vars.CY_E2E_TESTS}}
  API_TESTS:       ${{vars.CY_API_TESTS}}
  SLACK_CHANNEL:   ${{vars.CY_SLACK_CHANNEL}}
  SLACK_WEBHOOK:   ${{vars.CY_SLACK_WEBHOOK}}
  SLACK_USER:      ${{vars.SLACK_USER}}
  CI_PIPELINE_URL: "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ:              ${{vars.TZ}}
  NODE_VERSION:    22.x

jobs:
  set-run-params:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.set-params.outputs.environment }}
      app_name: ${{ steps.set-params.outputs.app_name }}
      browser: ${{ steps.set-params.outputs.browser }}
      test_suite: ${{ steps.set-params.outputs.test_suite }}
      commit_id: ${{ steps.set-params.outputs.commit_id }}
      commit_message: ${{ steps.set-params.outputs.commit_message }}
      commit_author: ${{ steps.set-params.outputs.commit_author }}
    steps:
      - id: set-params
        run: |
          # For scheduled runs
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 7 * * 1-5" ]]; then
              echo "environment=stage" >> $GITHUB_OUTPUT
              echo "app_name=testApp" >> $GITHUB_OUTPUT
              echo "browser=chrome" >> $GITHUB_OUTPUT
              echo "test_suite=ALL" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.schedule }}" == "0 8 * * 1-5" ]]; then
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "app_name=testApp" >> $GITHUB_OUTPUT
              echo "browser=chrome" >> $GITHUB_OUTPUT
              echo "test_suite=ALL" >> $GITHUB_OUTPUT
            fi

          # For workflow_dispatch runs
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment || 'stage' }}" >> $GITHUB_OUTPUT
            echo "app_name=${{ github.event.inputs.appName || 'testApp' }}" >> $GITHUB_OUTPUT
            echo "browser=${{ github.event.inputs.browser || 'chrome' }}" >> $GITHUB_OUTPUT
            echo "test_suite=${{ github.event.inputs.test_suite || 'ALL' }}" >> $GITHUB_OUTPUT
            
          # For repository_dispatch runs
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # Verify the source repository from client_payload
            if [[ -z "${{ github.event.client_payload.repository }}" || "${{ github.event.client_payload.repository }}" != "alexzavg/dev_repo" ]]; then
              echo "::error::This workflow only accepts events from alexzavg/dev_repo"
              exit 1
            fi
            
            # Get branch and commit info from the client_payload
            if [[ -z "${{ github.event.client_payload.branch }}" ]]; then
              echo "::error::Branch parameter is required in client_payload"
              exit 1
            fi
            
            BRANCH="${{ github.event.client_payload.branch }}"
            COMMIT_ID="${{ github.event.client_payload.commit_id || 'N/A' }}"
            COMMIT_MESSAGE="${{ github.event.client_payload.commit_message || 'N/A' }}"
            COMMIT_AUTHOR="${{ github.event.client_payload.commit_author || 'N/A' }}"
            
            echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
            echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
            echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
            
            # Only process master and stage branches
            if [[ "$BRANCH" == "master" ]]; then
              ENVIRONMENT="prod"
            elif [[ "$BRANCH" == "stage" ]]; then
              ENVIRONMENT="stage"
            else
              echo "::notice::Skipping execution for branch '$BRANCH' as it's not in the allowed list (master, stage)"
              exit 0  # Exit successfully without running tests
            fi
            
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "app_name=testApp" >> $GITHUB_OUTPUT
            echo "browser=chrome" >> $GITHUB_OUTPUT
            echo "test_suite=ALL" >> $GITHUB_OUTPUT
          fi
          
          echo "Using parameters:"
          echo "- Environment: $(cat $GITHUB_OUTPUT | grep 'environment=' | cut -d= -f2)"
          echo "- App Name: $(cat $GITHUB_OUTPUT | grep 'app_name=' | cut -d= -f2)"
          echo "- Browser: $(cat $GITHUB_OUTPUT | grep 'browser=' | cut -d= -f2)"
          echo "- Test Suite: $(cat $GITHUB_OUTPUT | grep 'test_suite=' | cut -d= -f2)"
          echo "- Trigger Commit ID: $(cat $GITHUB_OUTPUT | grep 'commit_id=' | cut -d= -f2-)"
          echo "- Commit Message: $(cat $GITHUB_OUTPUT | grep 'commit_message=' | cut -d= -f2-)"
          echo "- Commit Author: $(cat $GITHUB_OUTPUT | grep 'commit_author=' | cut -d= -f2-)"

  set-matrix:
    needs: set-run-params
    runs-on: ubuntu-22.04
    outputs:
      suite-matrix: ${{ steps.set-matrix.outputs.suite-matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL_SUITES=(
            "E2E_TESTS"
            "API_TESTS"
          )
          
          if [[ "${{ needs.set-run-params.outputs.test_suite }}" == "ALL" ]]; then
            # If ALL, use all suites
            SUITES_JSON=$(printf '%s\n' "${ALL_SUITES[@]}" | jq -R . | jq -c -s .)
          else
            # Use the specified test suite(s)
            IFS=',' read -ra SELECTED <<< "${{ needs.set-run-params.outputs.test_suite }}"
            SUITES_JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -c -s .)
          fi
          
          echo "suite-matrix=$SUITES_JSON" >> $GITHUB_OUTPUT
          echo "Using test suites: $(echo $SUITES_JSON | jq -r 'join(", ")')"

  cache-deps:
    needs: set-run-params
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cypress
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'cypress/package-lock.json'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache node_modules and Cypress cache
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            ~/.cache/Cypress
            ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-cypress-node-modules-${{ hashFiles('cypress/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-node-modules-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          npm install
          npm install -g ts-node

      - name: Verify Cypress
        run: npx cypress verify

  run_tests:
    needs: [set-run-params, set-matrix, cache-deps]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cypress
    strategy:
      matrix:
        suite: ${{ fromJson(needs.set-matrix.outputs.suite-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Cypress cache
        uses: actions/cache@v4
        with:
          path: |
            cypress/node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-deps-${{ hashFiles('cypress/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-deps-

      - name: Install dependencies
        run: |
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules)" ] || ! command -v cypress &> /dev/null; then
            echo "Installing dependencies..."
            npm install
            # Ensure Cypress is installed globally for the runner
            npm install -g cypress
          fi
          # Verify Cypress is available
          cypress --version

      - name: Create .env file
        run: |
          ENVIRONMENT="${{ needs.set-run-params.outputs.environment }}"
          echo "Using environment: $ENVIRONMENT"
          
          if [[ "$ENVIRONMENT" == "prod" ]]; then
            echo "${{ secrets.CY_CONFIG_PROD }}" > .env.prod
          elif [[ "$ENVIRONMENT" == "stage" ]]; then
            echo "${{ secrets.CY_CONFIG_STAGE }}" > .env.stage
          else
            echo "${{ secrets[format('CY_CONFIG_{0}', needs.set-run-params.outputs.environment)] }}" > ".env.$ENVIRONMENT"
          fi

      - name: Run tests
        run: |
          # Get the actual test directory from the environment variable
          SUITE_DIR=$(eval echo \$${{ matrix.suite }})
          
          echo "=== Test Configuration ==="
          echo "Environment: ${{ needs.set-run-params.outputs.environment }}"
          echo "App Name: ${{ needs.set-run-params.outputs.app_name }}"
          echo "Browser: ${{ needs.set-run-params.outputs.browser }}"
          echo "Suite Directory: $SUITE_DIR"
          echo "=========================="
          
          npm run clean:reports && \
            ENV=${{ needs.set-run-params.outputs.environment }} \
            APP_NAME=${{ needs.set-run-params.outputs.app_name }} \
            SUITE_NAME=$SUITE_DIR \
            cypress run --e2e --browser ${{ needs.set-run-params.outputs.browser }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="cy_${{ matrix.suite }}_${{ needs.set-run-params.outputs.browser }}_${{ needs.set-run-params.outputs.environment }}"
          echo "Checking for existing builds in ${SLUG}"
          
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          echo "URL: $curl_url"
          DIR_CONTENTS=$(curl -s "$curl_url" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          
          echo "Raw API response: $DIR_CONTENTS"
          
          if echo "$DIR_CONTENTS" | grep -q '"name"'; then
            echo "Directory exists, checking for builds..."
            LATEST_BUILD=$(echo "$DIR_CONTENTS" \
              | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' \
              | sort -nr \
              | head -n 1)
            
            if [ -z "$LATEST_BUILD" ]; then
              echo "No builds found yet, starting with 1"
              BUILD_NUMBER="1"
            else
              echo "Latest build found: $LATEST_BUILD"
              BUILD_NUMBER=$(($LATEST_BUILD + 1))
              echo "New build number: $BUILD_NUMBER"
            fi
          else
            echo "Directory exists but is empty, starting with 1"
            BUILD_NUMBER="1"
          fi
          
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
      - name: 🚀 Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        env:
          COMMIT_ID: ${{ needs.set-run-params.outputs.commit_id || 'N/A' }}
          COMMIT_MESSAGE: ${{ needs.set-run-params.outputs.commit_message || 'N/A' }}
          COMMIT_AUTHOR: ${{ needs.set-run-params.outputs.commit_author || 'N/A' }}
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"
          
          # Format commit message to be single line and escape quotes
          COMMIT_MSG_ESCAPED=$(echo "$COMMIT_MESSAGE" | tr '\n' ' ' | sed 's/"/\\"/g')
          
          # Truncate commit message if too long
          if [ ${#COMMIT_MSG_ESCAPED} -gt 100 ]; then
            COMMIT_MSG_ESCAPED="${COMMIT_MSG_ESCAPED:0:100}..."
          fi
          
          # Create trigger info text
          TRIGGER_INFO=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TRIGGER_INFO="\n*Triggered by*: 🧑 ${{ github.actor }}"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            TRIGGER_INFO="\n*Triggered by*: 🕰 Schedule"
          fi
          
          # Create commit info text (for repository_dispatch)
          COMMIT_INFO=""
          if [ "$COMMIT_ID" != "N/A" ]; then
            COMMIT_INFO="\n*Commit*: \`$COMMIT_ID\`\n*Author*: $COMMIT_AUTHOR\n*Message*: $COMMIT_MSG_ESCAPED"
          fi
          
          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "Commit: $COMMIT_ID"
          echo "Author: $COMMIT_AUTHOR"
          echo "Message: $COMMIT_MSG_ESCAPED"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          # Combine all info parts, filtering out empty ones
          MESSAGE_PARTS=(
            "$EMOJI App *${{ needs.set-run-params.outputs.app_name }}* tests with test suite *${{ matrix.suite }}*"
            "and browser *${{ needs.set-run-params.outputs.browser }}* on environment *${{ needs.set-run-params.outputs.environment }}*"
            "finished with status *$STATUS*"
            ":book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT>"
            "$SLACK_TAG"
            "$TRIGGER_INFO"
            "$COMMIT_INFO"
          )
          
          # Join non-empty parts with spaces
          MESSAGE="$(printf '%s\n' "${MESSAGE_PARTS[@]}" | grep -v '^$' | tr '\n' ' ' | sed 's/ *$//')"
          
          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$MESSAGE\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK