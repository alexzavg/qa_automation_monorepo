name: WDIO Mobile Tests
run-name: 📱 WDIO Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'stage'
        type: choice
        options: [stage, prod]
      appName:
        description: 'App Name'
        required: true
        default: 'testApp'
        type: string
      suiteName:
        description: 'Suite Name'
        required: true
        default: 'all'
        type: choice
        options: [all, e2e]
      androidVersion:
        description: 'Android API Version'
        required: true
        default: '34'
        type: choice
        options: ['35', '34', '33', '32', '31', '30']
      emulatorName:
        description: 'Emulator Name'
        required: true
        default: 'pixel_6'
        type: choice
        options: ['pixel_6', 'pixel_5', 'pixel_4', 'pixel_xl', 'pixel', 'Nexus 5X', 'Nexus 6P', 'Nexus 6']

env:
  NODE_VERSION: 20.x
  ANDROID_VERSION: ${{ github.event.inputs.androidVersion }}
  DEVICE_PROFILE: ${{ github.event.inputs.emulatorName }}
  ANDROID_IMAGE: google_apis
  ANDROID_ABI: x86_64
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0

jobs:
  mobile_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -s -O https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-${ANDROID_VERSION}" \
            "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};${ANDROID_ABI}" \
            "emulator" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Debug available devices
        run: |
          echo "📱 Available device profiles:"
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list device

      - name: Create and Boot Emulator (with Debug)
        run: |
          AVD_NAME="mobile_avd"

          echo "📂 Current AVDs before creation:"
          ls -la ~/.android/avd || echo "No AVDs yet"

          echo "🛠 Creating emulator with AVD name: $AVD_NAME and device profile: $DEVICE_PROFILE"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n $AVD_NAME \
            -k "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};${ANDROID_ABI}" \
            -d "$DEVICE_PROFILE" \
            --force

          echo "📂 Current AVDs after creation:"
          ls -la ~/.android/avd || echo "No AVDs created"

          echo "📋 Available AVDs:"
          $ANDROID_HOME/emulator/emulator -list-avds

          echo "🚀 Starting emulator..."
          nohup $ANDROID_HOME/emulator/emulator -avd $AVD_NAME -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &

          echo "⌛ Waiting for emulator to boot..."
          $ANDROID_HOME/platform-tools/adb wait-for-device

          for i in {1..30}; do
            booted=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [[ "$booted" == "1" ]]; then echo "✅ Booted"; break; fi
            echo "⏳ Waiting... ($i)"; sleep 10
          done

      - name: Install dependencies
        working-directory: ./wdio
        run: npm install

      - name: Create .env
        run: |
          cd wdio
          if [ "${{ github.event.inputs.environment }}" = "stage" ]; then
            echo "${{ secrets.WDIO_CONFIG_STAGE }}" > .env.stage
          else
            echo "${{ secrets.WDIO_CONFIG_PROD }}" > .env.prod
          fi

      - name: Run WDIO Tests
        working-directory: ./wdio
        run: |
          ENV=${{ github.event.inputs.environment }} npx wdio run wdio.android.conf.ts \
            --appName=${{ github.event.inputs.appName }} \
            --suiteName=${{ github.event.inputs.suiteName }} \
            --emulatorName=mobile_avd \
            --platformVersion=${{ env.ANDROID_VERSION }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ github.event.inputs.appName }}_${{ github.event.inputs.suiteName }}_${{ github.event.inputs.environment }}_mobile"
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          DIR_CONTENTS=$(curl -s "$curl_url" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          if [ -z "$DIR_CONTENTS" ]; then
            BUILD_NUMBER="1"
          else
            if echo "$DIR_CONTENTS" | grep -q '"name"'; then
              LATEST_BUILD=$(echo "$DIR_CONTENTS" | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' | sort -nr | head -n 1)
              if [ -z "$LATEST_BUILD" ]; then BUILD_NUMBER="1"; else BUILD_NUMBER=$(($LATEST_BUILD + 1)); fi
            else
              BUILD_NUMBER="1"
            fi
          fi
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wdio/html-report/allure-report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi
          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"
          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ github.event.inputs.suiteName }}* for app *${{ github.event.inputs.appName }}* on environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK
