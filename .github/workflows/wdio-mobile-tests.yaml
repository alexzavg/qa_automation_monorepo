name: WDIO Mobile Tests
run-name: 📱 WDIO Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      appName:
        description: 'Name of the app to test (e.g. testApp)'
        required: true
        default: 'testApp'
        type: string
      suiteName:
        description: 'Test suite name (e.g. e2e, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - e2e
      androidVersion:
        description: 'Android API level to use for the emulator'
        required: true
        default: '34'
        type: choice
        options:
          - '35'  # Android 15
          - '34'  # Android 14
          - '33'  # Android 13
          - '32'  # Android 12L
          - '31'  # Android 12
          - '30'  # Android 11
      emulatorName:
        description: 'Name of the emulator profile to use'
        required: true
        default: 'pixel_6'
        type: choice
        options:
          - 'pixel_6'
          - 'pixel_5'
          - 'pixel_4'
          - 'pixel_xl'
          - 'pixel'
          - 'Nexus 5X'
          - 'Nexus 6P'
          - 'Nexus 6'

env:
  SLACK_CHANNEL: ${{vars.WDIO_SLACK_CHANNEL}}
  SLACK_WEBHOOK: ${{vars.WDIO_SLACK_WEBHOOK}}
  SLACK_USER: ${{vars.SLACK_USER}}
  CI_PIPELINE_URL: "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ: ${{vars.TZ}}
  NODE_VERSION: 20.x
  # Using the selected Android version from input
  ANDROID_VERSION: ${{ github.event.inputs.androidVersion || '30' }}
  # Using a simpler device profile
  ANDROID_EMULATOR: ${{ github.event.inputs.emulatorName || 'pixel' }}
  # Default to Google APIs image for better compatibility
  ANDROID_IMAGE: google_apis

jobs:
  mobile_tests:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: ./wdio
        run: npm install

      - name: Create .env file
        run: |
          cd wdio
          if [ "${{ github.event.inputs.environment }}" = "stage" ]; then
            echo "${{ secrets.WDIO_CONFIG_STAGE }}" > .env.stage
            echo "Created .env.stage"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.WDIO_CONFIG_PROD }}" > .env.prod
            echo "Created .env.prod"
          fi

      - name: Setup Android SDK
        run: |
          # Install newer command-line tools that support Java 17
          cd $ANDROID_HOME
          wget https://dl.google.com/android/repository/commandlinetools-mac-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          
          # Set up environment variables
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          
          # Install platform tools and emulator
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "emulator"
          
          # Install system image
          echo "Installing system image for Android ${ANDROID_VERSION} (${ANDROID_IMAGE})"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};arm64-v8a"
          
          # Create AVD
          echo "Creating AVD with device profile: ${ANDROID_EMULATOR}"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};arm64-v8a" -d ${ANDROID_EMULATOR}
          
      - name: Start Android Emulator
        run: |
          # Kill any existing emulator and ADB server
          pkill -f 'emulator' || true
          adb kill-server || true
          
          # Start ADB server
          adb start-server
          
          # List available AVDs
          echo "Available AVDs:"
          ${ANDROID_HOME}/emulator/emulator -list-avds
          
          # Start the emulator with more verbose output
          echo "Starting emulator..."
          nohup ${ANDROID_HOME}/emulator/emulator -avd test \
            -no-window \
            -no-boot-anim \
            -no-audio \
            -no-snapshot \
            -gpu swiftshader \
            -memory 2048 \
            -partition-size 2048 \
            -accel auto \
            -no-snapshot-save \
            -no-snapshot-load \
            -no-snapshot-update-time \
            -logcat *:V \
            -show-kernel \
            -verbose \
            -debug init \
            > emulator.log 2>&1 &
            
          # Save emulator PID for later
          EMULATOR_PID=$!
          echo "Emulator started with PID: $EMULATOR_PID"
          
      - name: Wait for emulator
        run: |
          # Function to check emulator status
          check_emulator() {
              echo "Checking emulator status..."
              adb devices | grep -q emulator
          }
          
          echo "Waiting for emulator to start..."
          
          # Wait for emulator to be detected by ADB (up to 5 minutes)
          for i in {1..30}; do
              if check_emulator; then
                  echo "✅ Emulator detected"
                  break
              fi
              echo "⏳ Waiting for emulator... (attempt $i/30)"
              sleep 10
              
              # If we've been waiting for a while, show emulator log
              if [ $i -eq 10 ] || [ $i -eq 20 ]; then
                  echo "\n=== Emulator Log (last 20 lines) ==="
                  tail -n 20 emulator.log || true
                  echo "=================================\n"
              fi
              
              # Restart ADB server every few attempts
              if [ $((i % 5)) -eq 0 ]; then
                  echo "Restarting ADB server..."
                  adb kill-server
                  adb start-server
              fi
          done
          
          # Final check
          if ! check_emulator; then
              echo "❌ Failed to detect emulator after 30 attempts"
              echo "\n=== Full Emulator Log ==="
              cat emulator.log || true
              echo "\n=== ADB Devices ==="
              adb devices -l || true
              echo "\n=== Process List ==="
              ps aux | grep -i emulator || true
              exit 1
          fi
          
          # Wait for device to be ready
          echo "Waiting for device to be ready..."
          adb wait-for-device
          
          # Wait for boot to complete (up to 10 minutes)
          echo "Waiting for boot to complete..."
          BOOT_COMPLETED=false
          for i in {1..60}; do
              BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT_STATUS" = "1" ]; then
                  echo "✅ Boot completed"
                  BOOT_COMPLETED=true
                  break
              fi
              echo "⏳ Still waiting for boot to complete... (attempt $i/60)"
              sleep 10
              
              # If stuck, try to get more info
              if [ $i -eq 20 ] || [ $i -eq 40 ]; then
                  echo "\n=== Boot Info ==="
                  adb shell getprop | grep -E 'init.svc.bootanim|sys.boot_completed|dev.bootcomplete' || true
                  echo "=================\n"
              fi
          done
          
          if [ "$BOOT_COMPLETED" != "true" ]; then
              echo "❌ Boot did not complete after 10 minutes"
              echo "\n=== Last Boot Info ==="
              adb shell getprop | grep -E 'init.svc.bootanim|sys.boot_completed|dev.bootcomplete' || true
              echo "\n=== Logcat ==="
              adb logcat -d | tail -n 30 || true
              exit 1
          fi
          
          echo "✅ Emulator is ready"
          echo "\n=== Device Info ==="
          adb shell getprop | grep -E 'ro.build.version|ro.product' || true
          echo "\n=== ADB Devices ==="
          adb devices -l
          
      - name: Set up emulator
        run: |
          # Wait for boot to complete
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            echo "Waiting for boot to complete..."
            sleep 5
          done
          
          # Disable animations
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          
          # Enable hardware keyboard
          adb shell settings put secure show_ime_with_hard_keyboard 0
          
          # Disable spell checker
          adb shell settings put secure spell_checker_enabled 0
          
          # Disable auto-correct
          adb shell settings put secure auto_replace 0
          adb shell settings put secure auto_caps 0
          adb shell settings put secure auto_punctuate 0
          adb shell settings put secure show_password 0
          
          # Grant permissions
          adb root
          sleep 2
          adb shell pm grant com.android.shell android.permission.READ_EXTERNAL_STORAGE
          adb shell pm grant com.android.shell android.permission.WRITE_EXTERNAL_STORAGE

      - name: Run mobile tests
        working-directory: ./wdio
        run: |
          ENV=${{ github.event.inputs.environment }} npx wdio run wdio.android.conf.ts \
            --appName=${{ github.event.inputs.appName }} \
            --suiteName=${{ github.event.inputs.suiteName }} \
            --emulatorName=${{ env.ANDROID_EMULATOR }} \
            --platformVersion=${{ env.ANDROID_VERSION }}.0

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ github.event.inputs.appName }}_${{ github.event.inputs.suiteName }}_${{ github.event.inputs.environment }}_mobile"
          # Get the latest build number for this slug
          echo "Checking for existing builds in ${SLUG}"
          
          # First, get the directory contents from gh-pages branch
          echo "Checking contents of: ${SLUG}"
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          echo "URL: $curl_url"
          DIR_CONTENTS=$(curl -s "$curl_url" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          
          # Add debug output
          echo "Raw API response: $DIR_CONTENTS"
          
          if [ -z "$DIR_CONTENTS" ]; then
            echo "No builds found yet, starting with 1"
            BUILD_NUMBER="1"
          else
            # Check if the response is an array (directory exists)
            if echo "$DIR_CONTENTS" | grep -q '"name"'; then
              echo "Directory exists, checking for builds..."
              # Get the latest build number
              LATEST_BUILD=$(echo "$DIR_CONTENTS" \
                | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' \
                | sort -nr \
                | head -n 1)
              
              if [ -z "$LATEST_BUILD" ]; then
                echo "No builds found yet, starting with 1"
                BUILD_NUMBER="1"
              else
                echo "Latest build found: $LATEST_BUILD"
                BUILD_NUMBER=$(($LATEST_BUILD + 1))
                echo "New build number: $BUILD_NUMBER"
              fi
            else
              # If it's not an array, it means the directory exists but is empty
              echo "Directory exists but is empty, starting with 1"
              BUILD_NUMBER="1"
            fi
          fi
          
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wdio/html-report/allure-report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"

          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ github.event.inputs.suiteName }}* for app *${{ github.event.inputs.appName }}* on environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK
