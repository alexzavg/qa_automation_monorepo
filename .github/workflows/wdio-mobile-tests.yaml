name: WDIO Mobile Tests
run-name: 📱 WDIO Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      appName:
        description: 'Name of the app to test (e.g. testApp)'
        required: true
        default: 'testApp'
        type: string
      suiteName:
        description: 'Test suite name (e.g. e2e, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - e2e
      androidVersion:
        description: 'Android API level to use for the emulator'
        required: true
        default: '34'
        type: choice
        options:
          - '35'
          - '34'
          - '33'
          - '32'
          - '31'
          - '30'
      emulatorName:
        description: 'Name of the emulator profile to use'
        required: true
        default: 'pixel_6'
        type: choice
        options:
          - 'pixel_6'
          - 'pixel_5'
          - 'pixel_4'
          - 'pixel_xl'
          - 'pixel'
          - 'Nexus 5X'
          - 'Nexus 6P'
          - 'Nexus 6'

env:
  NODE_VERSION: 20.x
  ANDROID_VERSION: ${{ github.event.inputs.androidVersion }}
  ANDROID_EMULATOR: ${{ github.event.inputs.emulatorName }}
  ANDROID_IMAGE: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0
  EMULATOR_TIMEOUT: 350
  SLACK_CHANNEL: ${{ vars.WDIO_SLACK_CHANNEL }}
  SLACK_WEBHOOK: ${{ vars.WDIO_SLACK_WEBHOOK }}
  SLACK_USER: ${{ vars.SLACK_USER }}
  CI_PIPELINE_URL: "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{ github.run_id }}"
  TZ: ${{ vars.TZ }}

jobs:
  mobile_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Android SDK & Emulator
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -O https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-${ANDROID_VERSION}" \
            "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};${ANDROID_ARCH}" \
            "emulator" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Create and Start Android Emulator
        run: |
          mkdir -p $HOME/.android/avd

          echo "Creating emulator named: $ANDROID_EMULATOR"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n "$ANDROID_EMULATOR" \
            -k "system-images;android-${ANDROID_VERSION};${ANDROID_IMAGE};${ANDROID_ARCH}" \
            -d "${ANDROID_EMULATOR}" \
            --force

          nohup $ANDROID_HOME/emulator/emulator -avd "$ANDROID_EMULATOR" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &

          echo "Waiting for emulator to boot..."
          $ANDROID_HOME/platform-tools/adb wait-for-device

          boot_completed=""
          retry=0
          while [ "$boot_completed" != "1" ] && [ $retry -lt 30 ]; do
            boot_completed=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "⏳ boot_completed=$boot_completed (attempt $retry)"
            sleep 10
            retry=$((retry+1))
          done

          if [ "$boot_completed" != "1" ]; then
            echo "❌ Emulator failed to boot in time"
            exit 1
          fi

          echo "✅ Emulator booted successfully"

      - name: Install dependencies
        working-directory: ./wdio
        run: npm install

      - name: Create .env file
        run: |
          cd wdio
          if [ "${{ github.event.inputs.environment }}" = "stage" ]; then
            echo "${{ secrets.WDIO_CONFIG_STAGE }}" > .env.stage
            echo "Created .env.stage"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.WDIO_CONFIG_PROD }}" > .env.prod
            echo "Created .env.prod"
          fi

      - name: Run Mobile Tests
        working-directory: ./wdio
        run: |
          ENV=${{ github.event.inputs.environment }} npx wdio run wdio.android.conf.ts \
            --appName=${{ github.event.inputs.appName }} \
            --suiteName=${{ github.event.inputs.suiteName }} \
            --emulatorName=${{ env.ANDROID_EMULATOR }} \
            --platformVersion=${{ env.ANDROID_VERSION }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ github.event.inputs.appName }}_${{ github.event.inputs.suiteName }}_${{ github.event.inputs.environment }}_mobile"
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          DIR_CONTENTS=$(curl -s "$curl_url" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          if [ -z "$DIR_CONTENTS" ]; then
            BUILD_NUMBER="1"
          else
            if echo "$DIR_CONTENTS" | grep -q '"name"'; then
              LATEST_BUILD=$(echo "$DIR_CONTENTS" | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' | sort -nr | head -n 1)
              if [ -z "$LATEST_BUILD" ]; then BUILD_NUMBER="1"; else BUILD_NUMBER=$(($LATEST_BUILD + 1)); fi
            else
              BUILD_NUMBER="1"
            fi
          fi
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wdio/html-report/allure-report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi
          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"
          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ github.event.inputs.suiteName }}* for app *${{ github.event.inputs.appName }}* on environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK
