name: WDIO Mobile Tests
run-name: 📱 WDIO Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      appName:
        description: 'Name of the app to test (e.g. testApp)'
        required: true
        default: 'testApp'
        type: string
      suiteName:
        description: 'Test suite name (e.g. e2e, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - e2e
      androidVersion:
        description: 'Android API level to use for the emulator'
        required: true
        default: '34'
        type: choice
        options:
          - '35'  # Android 15
          - '34'  # Android 14
          - '33'  # Android 13
          - '32'  # Android 12L
          - '31'  # Android 12
          - '30'  # Android 11
      emulatorName:
        description: 'Name of the emulator profile to use'
        required: true
        default: 'pixel_6'
        type: choice
        options:
          - 'pixel_6'
          - 'pixel_5'
          - 'pixel_4'
          - 'pixel_xl'
          - 'pixel'
          - 'Nexus 5X'
          - 'Nexus 6P'
          - 'Nexus 6'

env:
  # Slack and general environment variables
  SLACK_CHANNEL: ${{vars.WDIO_SLACK_CHANNEL}}
  SLACK_WEBHOOK: ${{vars.WDIO_SLACK_WEBHOOK}}
  SLACK_USER: ${{vars.SLACK_USER}}
  CI_PIPELINE_URL: "https://github.com/alexzavg/qa_automation_monorepo/actions/runs/${{github.run_id}}"
  TZ: ${{vars.TZ}}
  
  # Node.js version
  NODE_VERSION: 20.x
  
  # Android configuration
  ANDROID_VERSION: ${{ github.event.inputs.androidVersion || '34' }}
  ANDROID_EMULATOR: ${{ github.event.inputs.emulatorName || 'pixel_6' }}
  ANDROID_IMAGE: google_apis
  ANDROID_BUILD_TOOLS_VERSION: 33.0.2
  
  # ARM64 architecture settings for M1/M2 Macs
  ANDROID_ARCH: arm64-v8a
  ANDROID_ABI: arm64-v8a
  ANDROID_SYSTEM_IMAGE: system-images;android-${{ github.event.inputs.androidVersion || '34' }};google_apis;arm64-v8a
  ANDROID_SDK_PACKAGES: platforms;android-${{ github.event.inputs.androidVersion || '34' }} build-tools;33.0.2 platform-tools emulator system-images;android-${{ github.event.inputs.androidVersion || '34' }};google_apis;arm64-v8a
  EMULATOR_TIMEOUT: 350
  
  # Android SDK paths
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  
  # Base PATH for Android tools (will be extended in the workflow step)
  BASE_ANDROID_PATH: ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/android-sdk/emulator:${{ github.workspace }}/android-sdk/platform-tools:${{ github.workspace }}/android-sdk/tools/bin:${{ github.workspace }}/android-sdk/build-tools/33.0.2

jobs:
  mobile_tests:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android environment
        run: |
          # Create required directories
          mkdir -p $ANDROID_HOME/emulator
          mkdir -p $ANDROID_HOME/platform-tools
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          
          # Add Android tools to PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          # Set environment variables
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV
          
          # Verify SDK root
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME
          
      - name: Install Android SDK and tools
        id: setup_android
        run: |
          echo "Setting up for ARM64 architecture (M1/M2 Macs)"
          
          # Set environment variables
          export ANDROID_HOME="${{ env.ANDROID_HOME }}"
          export ANDROID_SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools"
          
          # Create Android SDK directory
          mkdir -p "$ANDROID_HOME"
          
          # Download and extract command line tools
          cd "$ANDROID_HOME"
          echo "Downloading command line tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/
          
          # Verify sdkmanager is available
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Error: sdkmanager not found!"
            ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/"
            exit 1
          fi
          
          # Update PATH for the current step
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          
          # Create licenses directory and accept all licenses
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n601085b94cd77f4b54fdd51d5c8f40578350695c" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n33b6a2b64607f11b758fbaef771056a541b65e6b" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          # Update the SDK manager
          echo "Updating SDK manager..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          
          # Install required components
          echo "Installing platform tools..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          
          echo "Installing platform ${{ env.ANDROID_VERSION }}..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-${{ env.ANDROID_VERSION }}"
          
          echo "Installing build tools..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"
          
          echo "Installing emulator..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "emulator"
          
          # Install the ARM64 system image (using google_apis instead of google_apis_playstore)
          echo "Installing ARM64 system image..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-${{ env.ANDROID_VERSION }};google_apis;arm64-v8a"
          
          # Verify installation
          echo "=== Installed packages ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list
          
          echo "=== Available system images ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep 'system-images' || true
          
          # Set output variables for subsequent steps
          echo "ANDROID_ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "ANDROID_SYSTEM_IMAGE=system-images;android-${{ env.ANDROID_VERSION }};google_apis;arm64-v8a" >> $GITHUB_ENV
          echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
          
      - name: List Installed System Images
        run: |
          echo "=== Listing Installed System Images ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep 'system-images' || echo "No system images found"
          
          echo "=== Available AVD System Images ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list | grep 'system-images' || echo "No AVD system images found"
          
          echo "=== Contents of system-images directory ==="
          ls -la $ANDROID_HOME/system-images/ || echo "No system-images directory found"

      - name: Create Android Virtual Device (AVD)
        run: |
          # Export environment variables for current step
          export ANDROID_HOME="${{ env.ANDROID_HOME }}"
          export ANDROID_SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools"
          
          # Create necessary directories
          mkdir -p "$HOME/.android/avd/"
          
          # Use the system image we just installed
          SYSTEM_IMAGE="system-images;android-${{ env.ANDROID_VERSION }};google_apis;arm64-v8a"
          ABI="arm64-v8a"
          
          # Verify the system image exists
          if ! $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep -q "$SYSTEM_IMAGE"; then
            echo "Error: Required system image not found: $SYSTEM_IMAGE"
            echo "Installed system images:"
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep 'system-images' || true
            exit 1
          fi
          
          echo "=== Creating AVD with ARM64 architecture ==="
          echo "Using system image: $SYSTEM_IMAGE"
          echo "Using ABI: $ABI"
          
          # Delete existing AVD if it exists
          if [ -d "$HOME/.android/avd/${{ env.ANDROID_EMULATOR }}.avd" ]; then
            echo "Deleting existing AVD..."
            rm -rf "$HOME/.android/avd/${{ env.ANDROID_EMULATOR }}.avd"
            rm -f "$HOME/.android/avd/${{ env.ANDROID_EMULATOR }}.ini"
          fi
          
          # Create the AVD
          echo "Creating AVD..."
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            --name "${{ env.ANDROID_EMULATOR }}" \
            --package "$SYSTEM_IMAGE" \
            --abi "$ABI" \
            --force || {
              echo "Failed to create AVD. Check the logs above for details."
              exit 1
            }
          
          # List available AVDs for verification
          echo "=== Available AVDs ==="
          $ANDROID_HOME/emulator/emulator -list-avds
          
          # Configure AVD settings
          AVD_CONFIG="$HOME/.android/avd/${{ env.ANDROID_EMULATOR }}.avd/config.ini"
          
          echo "=== Configuring AVD settings ==="
          # Remove existing config if it exists
          [ -f "$AVD_CONFIG" ] && rm "$AVD_CONFIG"
          
          # Basic AVD settings
          echo "hw.cpu.arch=arm64" >> "$AVD_CONFIG"
          echo "hw.cpu.ncore=4" >> "$AVD_CONFIG"
          echo "hw.ramSize=4096" >> "$AVD_CONFIG"
          echo "vm.heapSize=512" >> "$AVD_CONFIG"
          echo "hw.gpu.enabled=yes" >> "$AVD_CONFIG"
          echo "hw.gpu.mode=swiftshader_indirect" >> "$AVD_CONFIG"
          echo "showDeviceFrame=no" >> "$AVD_CONFIG"
          
          # Performance settings
          echo "disk.dataPartition.size=2G" >> "$AVD_CONFIG"
          echo "hw.initialOrientation=portrait" >> "$AVD_CONFIG"
          echo "skin.dynamic=no" >> "$AVD_CONFIG"
          echo "hw.keyboard=yes" >> "$AVD_CONFIG"
          echo "hw.mainKeys=no" >> "$AVD_CONFIG"
          
          # Disable animations for faster startup
          echo "hw.initialWindowX=0" >> "$AVD_CONFIG"
          echo "hw.initialWindowY=0" >> "$AVD_CONFIG"
          echo "hw.lcd.density=420" >> "$AVD_CONFIG"
          echo "hw.lcd.height=2400" >> "$AVD_CONFIG"
          echo "hw.lcd.width=1080" >> "$AVD_CONFIG"
          echo "hw.sdCard=no" >> "$AVD_CONFIG"
          echo "hw.sensors.orientation=no" >> "$AVD_CONFIG"
          echo "hw.sensors.proximity=no" >> "$AVD_CONFIG"
          echo "hw.trackBall=no" >> "$AVD_CONFIG"
          echo "vm.heapGrowthLimit=192m" >> "$AVD_CONFIG"
          echo "vm.heapsize=512m" >> "$AVD_CONFIG"
          echo "vm.stack=32m" >> "$AVD_CONFIG"
          
          # Display AVD configuration
          echo "=== AVD configuration ==="
          cat "$AVD_CONFIG"
          
          # Verify AVD was created successfully
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "Error: AVD configuration file was not created!"
            exit 1
          fi

      - name: Launch Android Emulator
        run: |
          # Set environment variables
          export ANDROID_HOME="${{ env.ANDROID_HOME }}"
          export ANDROID_SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools"
          
          # Verify environment
          echo "=== Environment Variables ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_AVD_HOME: $ANDROID_AVD_HOME"
          echo "PATH: $PATH"
          
          # Verify emulator binary exists
          if [ ! -f "$ANDROID_HOME/emulator/emulator" ]; then
            echo "Error: Emulator binary not found at $ANDROID_HOME/emulator/emulator"
            ls -la "$ANDROID_HOME/emulator/" || true
            exit 1
          fi
          
          # List available AVDs
          echo "=== Available AVDs ==="
          $ANDROID_HOME/emulator/emulator -list-avds
          
          # Make the script executable
          chmod +x .github/scripts/start_android_headless.sh
          
          # Verify the script exists
          if [ ! -f ".github/scripts/start_android_headless.sh" ]; then
            echo "Error: start_android_headless.sh not found!"
            exit 1
          fi
          
          # Start the emulator
          echo "=== Starting Emulator ==="
          EMULATOR_TIMEOUT=350 \
          EMULATOR_NAME="${{ env.ANDROID_EMULATOR }}" \
          ANDROID_HOME="$ANDROID_HOME" \
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
          PATH="$PATH" \
          ./.github/scripts/start_android_headless.sh
          
          # Wait for emulator to be fully booted
          echo "=== Waiting for emulator to be ready ==="
          $ANDROID_HOME/platform-tools/adb wait-for-device
          
          # Check if device is booted
          echo "=== Checking device status ==="
          $ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed | grep -q 1
          
          # List all connected devices
          echo "=== Connected Android Devices ==="
          $ANDROID_HOME/platform-tools/adb devices -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./wdio
        run: npm install

      - name: Create .env file
        run: |
          cd wdio
          if [ "${{ github.event.inputs.environment }}" = "stage" ]; then
            echo "${{ secrets.WDIO_CONFIG_STAGE }}" > .env.stage
            echo "Created .env.stage"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.WDIO_CONFIG_PROD }}" > .env.prod
            echo "Created .env.prod"
          fi

      - name: Run mobile tests
        working-directory: ./wdio
        run: |
          ENV=${{ github.event.inputs.environment }} npx wdio run wdio.android.conf.ts \
            --appName=${{ github.event.inputs.appName }} \
            --suiteName=${{ github.event.inputs.suiteName }} \
            --emulatorName=${{ env.ANDROID_EMULATOR }} \
            --platformVersion=${{ env.ANDROID_VERSION }}

      - name: Get latest build number
        if: always()
        id: get_build_number
        run: |
          SLUG="${{ github.event.inputs.appName }}_${{ github.event.inputs.suiteName }}_${{ github.event.inputs.environment }}_mobile"
          # Get the latest build number for this slug
          echo "Checking for existing builds in ${SLUG}"
          
          # First, get the directory contents from gh-pages branch
          echo "Checking contents of: ${SLUG}"
          curl_url="https://api.github.com/repos/${{ github.repository }}/contents/${SLUG}?ref=gh-pages"
          echo "URL: $curl_url"
          DIR_CONTENTS=$(curl -s "$curl_url" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")
          
          # Add debug output
          echo "Raw API response: $DIR_CONTENTS"
          
          if [ -z "$DIR_CONTENTS" ]; then
            echo "No builds found yet, starting with 1"
            BUILD_NUMBER="1"
          else
            # Check if the response is an array (directory exists)
            if echo "$DIR_CONTENTS" | grep -q '"name"'; then
              echo "Directory exists, checking for builds..."
              # Get the latest build number
              LATEST_BUILD=$(echo "$DIR_CONTENTS" \
                | jq -r '.[] | select(.name | test("^[0-9]+$")) | .name' \
                | sort -nr \
                | head -n 1)
              
              if [ -z "$LATEST_BUILD" ]; then
                echo "No builds found yet, starting with 1"
                BUILD_NUMBER="1"
              else
                echo "Latest build found: $LATEST_BUILD"
                BUILD_NUMBER=$(($LATEST_BUILD + 1))
                echo "New build number: $BUILD_NUMBER"
              fi
            else
              # If it's not an array, it means the directory exists but is empty
              echo "Directory exists but is empty, starting with 1"
              BUILD_NUMBER="1"
            fi
          fi
          
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Deploy suite report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wdio/html-report/allure-report
          destination_dir: ${{ steps.get_build_number.outputs.SLUG }}/${{ steps.get_build_number.outputs.BUILD_NUMBER }}

      - name: Notify Slack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2EB67D"
          EMOJI=":white_check_mark:"
          SLACK_TAG=""
          if [ "$STATUS" == "failure" ]; then
            COLOR="#E01E5A"
            EMOJI=":x:"
            SLACK_TAG="<${{ env.SLACK_USER }}>"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="#808080"
            EMOJI=":black_square_for_stop:"
          fi

          SLUG=${{ steps.get_build_number.outputs.SLUG }}
          BUILD_NUMBER=${{ steps.get_build_number.outputs.BUILD_NUMBER }}
          REPORT_URL="https://alexzavg.github.io/qa_automation_monorepo/${SLUG}/${BUILD_NUMBER}"

          echo ""
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo "🟩 REPORT URL FOR ${STATUS^^}: ${REPORT_URL}"
          echo "🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"
          echo ""

          curl -X POST -H 'Content-type: application/json' --data "{
            \"channel\":\"$SLACK_CHANNEL\",
            \"username\":\"Github\",
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"text\":\"$EMOJI Test suite *${{ github.event.inputs.suiteName }}* for app *${{ github.event.inputs.appName }}* on environment *${{ github.event.inputs.environment }}* finished with status *$STATUS*. :book: <${{ env.CI_PIPELINE_URL }}|LOGS>, :bar_chart: <$REPORT_URL|REPORT> $SLACK_TAG\",
              \"footer\":\"Time: $(TZ=$TZ date)\"
            }]
          }" $SLACK_WEBHOOK
